    <!-- 引入主样式 -->
    <link rel="stylesheet" href="../assets/css/style.css">
    <!-- 引入兴趣爱好页面样式 -->
    <link rel="stylesheet" href="../assets/css/hobbies.css">
</head>
<body>
    <!-- 导航栏 -->
    <header>
        <nav class="navbar">
            <div class="container">
                <div class="logo">
                    <a href="../index.html">个人博客</a>
                </div>
                <div class="menu" id="main-menu">
                    <ul>
                        <li><a href="../index.html"><i class="fas fa-home"></i> 首页</a></li>
                        <li><a href="about.html"><i class="fas fa-user"></i> 我的</a></li>
                        <li><a href="journey.html"><i class="fas fa-map-marker-alt"></i> 旅程</a></li>
                        <li><a href="gallery.html"><i class="fas fa-images"></i> 相册</a></li>
                        <li><a href="reading.html"><i class="fas fa-book"></i> 读书</a></li>
                        <li><a href="hobbies.html" class="active"><i class="fas fa-star"></i> 兴趣爱好</a></li>
                        <li><a href="pets.html"><i class="fas fa-paw"></i> 宠物</a></li>
                    </ul>
                </div>
                <div class="mobile-menu-btn" id="mobile-menu-btn">
                    <i class="fas fa-bars"></i>
                </div>
            </div>
        </nav>
    </header>

    <!-- 主要内容区域 -->
    <main>
        <!-- 兴趣爱好头部 -->
        <section class="hobbies-header">
            <div class="container">
                <h1>我的兴趣爱好</h1>
                <p>探索生活中的美好，发现不一样的自己</p>
            </div>
        </section>

        <!-- 兴趣爱好分类 -->
        <section class="hobbies-categories">
            <div class="container">
                <div class="category-tabs">
                    <button class="tab-btn active" data-category="all">全部</button>
                    <button class="tab-btn" data-category="sports">运动健身</button>
                    <button class="tab-btn" data-category="arts">艺术创作</button>
                    <button class="tab-btn" data-category="tech">科技数码</button>
                    <button class="tab-btn" data-category="food">美食烹饪</button>
                    <button class="tab-btn" data-category="nature">自然探索</button>
                </div>
            </div>
        </section>

        <!-- 兴趣爱好卡片列表 -->
        <section class="hobbies-content">
            <div class="container">
                <div class="hobbies-grid" id="hobbies-grid">
                    <!-- 兴趣爱好卡片将通过JavaScript动态生成 -->
                </div>
            </div>
        </section>

        <!-- 兴趣爱好详情模态框 -->
        <div class="modal" id="hobby-modal">
            <div class="modal-content">
                <span class="close-modal">&times;</span>
                <div class="hobby-detail-content">
                    <!-- 详情内容将通过JavaScript动态生成 -->
                </div>
            </div>
        </div>
    </main>

    <!-- 页脚 -->
    <footer>
        <div class="container">
            <div class="footer-content">
                <div class="footer-info">
                    <h3>个人博客</h3>
                    <p>记录生活的点滴，分享美好的瞬间</p>
                </div>
                <div class="footer-links">
                    <ul>
                        <li><a href="../index.html">首页</a></li>
                        <li><a href="about.html">关于我</a></li>
                        <li><a href="journey.html">旅行足迹</a></li>
                        <li><a href="gallery.html">相册</a></li>
                        <li><a href="reading.html">读书笔记</a></li>
                        <li><a href="hobbies.html">兴趣爱好</a></li>
                        <li><a href="pets.html">宠物</a></li>
                    </ul>

                <div class="footer-social">
                    <a href="#" class="social-icon"><i class="fab fa-weixin"></i></a>
                    <a href="#" class="social-icon"><i class="fab fa-weibo"></i></a>
                    <a href="#" class="social-icon"><i class="fab fa-github"></i></a>
                    <a href="#" class="social-icon"><i class="fab fa-instagram"></i></a>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2023 个人博客网站. All Rights Reserved.</p>
            </div>
        </div>
    </footer>

    <!-- 返回顶部按钮 -->
    <button class="back-to-top" id="back-to-top">
        <i class="fas fa-arrow-up"></i>
    </button>

    <!-- 引入主JavaScript -->
    <script src="../assets/js/main.js"></script>
    <!-- 引入兴趣爱好页面JavaScript -->
    <script src="../assets/js/hobbies.js"></script>
