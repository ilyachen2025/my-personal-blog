<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>相册 - 我的个人博客网站</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/gallery.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="../index.html">首页</a></li>
                <li><a href="about.html">我的</a></li>
                <li><a href="journey.html">旅程</a></li>
                <li><a href="gallery.html" class="active">相册</a></li>
                <li><a href="reading.html">读书</a></li>
                <li><a href="hobbies.html">兴趣爱好</a></li>
                <li><a href="pets.html">宠物</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="gallery-section">
            <div class="gallery-header">
                <h1>我的相册</h1>
                <p>记录生活中的美好瞬间</p>
            </div>

            <div class="gallery-filters">
                <button class="filter-btn active" data-filter="all">全部</button>
                <button class="filter-btn" data-filter="travel">旅行</button>
                <button class="filter-btn" data-filter="food">美食</button>
                <button class="filter-btn" data-filter="nature">自然</button>
                <button class="filter-btn" data-filter="pets">宠物</button>
            </div>

            <div class="gallery-container">
                <div class="masonry-grid">
                    <!-- 图片将通过JavaScript动态生成 -->
                </div>
                <div class="loading-more">
                    <div class="loading"></div>
                    <p>加载更多图片...</p>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="footer-content">
            <div class="footer-links">
                <a href="../index.html">首页</a>
                <a href="about.html">我的</a>
                <a href="journey.html">旅程</a>
                <a href="gallery.html">相册</a>
                <a href="reading.html">读书</a>
                <a href="hobbies.html">兴趣爱好</a>
                <a href="pets.html">宠物</a>
            </div>
            <div class="footer-social">
                <a href="#"><i class="fab fa-weixin"></i></a>
                <a href="#"><i class="fab fa-weibo"></i></a>
                <a href="#"><i class="fab fa-github"></i></a>
            </div>
            <div class="footer-copyright">
                <p>&copy; 2023 我的个人博客网站. 保留所有权利.</p>
            </div>
        </div>
    </footer>

    <!-- 图片查看器模态框 -->
    <div id="image-viewer" class="image-viewer">
        <span class="close-viewer">&times;</span>
        <button class="prev-btn"><i class="fas fa-chevron-left"></i></button>
        <button class="next-btn"><i class="fas fa-chevron-right"></i></button>
        <div class="viewer-content">
            <img id="current-image" src="" alt="查看图片">
        </div>
        <div class="image-info">
            <h3 id="image-title"></h3>
            <p id="image-desc"></p>
        </div>
    </div>

    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/gallery.js"></script>
</body>
</html>
